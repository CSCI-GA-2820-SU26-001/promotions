<!DOCTYPE html>
<html>
  <head>
    <title>Promotions Service</title>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="static/css/cerulean_bootstrap.min.css">
  </head>
  <body>
    <div class="container">
      <div class="page-header">
        <h1>Promotions REST API Service</h1>
      </div>

      <!-- Flash Message -->
      <div class="table-responsive">
        <table class="table">
          <tr><td>Status:</td><td><span id="flash_message"></span></td></tr>
        </table>
      </div>

      <!-- FORM -->
      <div class="col-md-12" id="form_data">
        <h3>Create, Retrieve, Update, and Delete a Promotion:</h3>
        <div class="well">
          <div class="form-horizontal">

            <!-- ID + Retrieve/Delete -->
            <div class="form-group">
              <label class="control-label col-sm-2" for="promotion_id">Promotion ID:</label>
              <div class="col-sm-6">
                <input type="text" class="form-control" id="promotion_id" placeholder="Enter ID of Promotion">
              </div>
              <div class="col-sm-4">
                <button type="button" class="btn btn-primary" id="retrieve-btn">Retrieve</button>
                <button type="button" class="btn btn-danger"  id="delete-btn">Delete</button>
              </div>
            </div>

            <!-- NAME -->
            <div class="form-group">
              <label class="control-label col-sm-2" for="promotion_name">Name:</label>
              <div class="col-sm-10">
                <input type="text" class="form-control" id="promotion_name" placeholder="Enter name for Promotion">
              </div>
            </div>

            <!-- TYPE -->
            <div class="form-group">
              <label class="control-label col-sm-2" for="promotion_type">Type:</label>
              <div class="col-sm-10">
                <select class="form-control" id="promotion_type">
                  <option value="UNKNOWN">Unknown</option>
                  <option value="PERCENT_OFF">Percent Off</option>
                  <option value="FIXED_AMOUNT">Fixed Amount</option>
                  <option value="BOGO">BOGO</option>
                </select>
              </div>
            </div>

            <!-- DISCOUNT VALUE -->
            <div class="form-group">
              <label class="control-label col-sm-2" for="promotion_discount">Discount Value:</label>
              <div class="col-sm-10">
                <input type="number" class="form-control" id="promotion_discount" placeholder="0.00" step="0.01" min="0">
              </div>
            </div>

            <!-- START DATE -->
            <div class="form-group">
              <label class="control-label col-sm-2" for="promotion_start_date">Start Date:</label>
              <div class="col-sm-10">
                <input type="date" class="form-control" id="promotion_start_date">
              </div>
            </div>

            <!-- END DATE -->
            <div class="form-group">
              <label class="control-label col-sm-2" for="promotion_end_date">End Date:</label>
              <div class="col-sm-10">
                <input type="date" class="form-control" id="promotion_end_date">
              </div>
            </div>

            <!-- BUTTONS -->
            <div class="form-group">
              <div class="col-sm-offset-2 col-sm-10">
                <button type="button" class="btn btn-primary" id="search-btn">Search</button>
                <button type="button" class="btn btn-primary" id="list-btn">List All</button>
                <button type="button" class="btn btn-default" id="clear-btn">Clear</button>
                <button type="button" class="btn btn-success" id="create-btn">Create</button>
                <button type="button" class="btn btn-warning" id="update-btn">Update</button>
                <button type="button" class="btn btn-danger"  id="deactivate-btn">Deactivate</button>
              </div>
            </div>

          </div> <!-- form-horizontal -->
        </div> <!-- well -->
      </div> <!-- form_data -->

      <!-- Search Results -->
      <div class="table-responsive col-md-12" id="search_results">
        <table class="table table-striped">
          <thead>
            <tr>
              <th class="col-md-1">ID</th>
              <th class="col-md-3">Name</th>
              <th class="col-md-2">Type</th>
              <th class="col-md-2">Discount</th>
              <th class="col-md-2">Start Date</th>
              <th class="col-md-2">End Date</th>
              <th class="col-md-1">Active</th>
            </tr>
          </thead>
          <tbody id="results_body"></tbody>
        </table>
      </div>

      <footer>
        <br><br>
        <p>&copy; NYU DevOps 2026</p>
      </footer>

    </div> <!-- container -->

    <script type="text/javascript" src="static/js/jquery-3.6.0.min.js"></script>
    <script type="text/javascript" src="static/js/bootstrap.min.js"></script>
    <script type="text/javascript" src="static/js/rest_api.js"></script>
  </body>
</html>
